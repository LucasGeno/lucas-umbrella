<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lucas Reed — Room 1</title>
<style>
/* ============================================================
   THE PLAQUE — tokens (forked from design system colors_and_type.css)
   ============================================================ */
@font-face {
  font-family: "Roboto Flex";
  src: url("fonts/RobotoFlex.ttf") format("truetype-variations");
  font-weight: 100 1000;
  font-stretch: 25% 151%;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Inter Tight";
  src: url("fonts/InterTight.ttf") format("truetype-variations");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

:root,
:root[data-theme="light"] {
  --plaque-paper:    #f3ede0;
  --plaque-paper-2:  #ebe3d3;
  --plaque-ink:      #0c0c0a;
  --plaque-ink-2:    #2a2a26;
  --plaque-ink-3:    #5d5c55;
}
:root[data-theme="dark"] {
  --plaque-paper:    #14110d;
  --plaque-paper-2:  #0f0e0a;
  --plaque-ink:      #e8e6e1;
  --plaque-ink-2:    #b8b6b1;
  --plaque-ink-3:    #8a8478;
}
:root {
  --plaque-font-wordmark: "Roboto Flex", system-ui, sans-serif;
  --plaque-font-body:     "Inter Tight", system-ui, sans-serif;

  --plaque-size-mark:     clamp(72px, 18vw, 280px);
  --plaque-size-section:  14px;
  --plaque-size-meta:     13px;
  --plaque-size-copy:     16px;
  --plaque-size-colophon: 12px;

  --plaque-mark-rest:   "opsz" 144, "wdth" 125, "wght" 800;
  --plaque-mark-active: "opsz" 144, "wdth" 125, "wght" 100;

  --plaque-s-2: 8px;
  --plaque-s-4: 16px;
  --plaque-s-5: 24px;
  --plaque-s-6: 32px;
  --plaque-s-7: 48px;
  --plaque-s-8: 64px;

  --plaque-t-fast: 120ms ease;
  --plaque-t-base: 400ms ease;
  --plaque-ease-spring: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-reduced-motion: reduce) {
  :root { --plaque-t-fast: 0ms; --plaque-t-base: 0ms; }
}

/* ============================================================
   STAGE — letterbox the fixed 1440×900 frame into any viewport
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: #000;
  font-family: var(--plaque-font-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
.stage {
  position: fixed; inset: 0;
  overflow: hidden;
  background: #000;
}
.frame {
  position: absolute;
  top: 50%; left: 50%;
  width: 1440px; height: 900px;
  transform: translate(-50%, -50%) scale(1);
  transform-origin: center center;
  overflow: hidden;
}

/* ============================================================
   CAROUSEL — structural only. No chrome but the three dots.
   Each room owns its own background; container has none.
   ============================================================ */
.carousel {
  width: 100%; height: 100%;
  position: relative;
  overflow: hidden;
}
.carousel-track {
  display: flex;
  width: 100%; height: 100%;
  transform: translateX(0);
  transition: transform 500ms ease-in-out;
  will-change: transform;
}
@media (prefers-reduced-motion: reduce) {
  .carousel-track { transition-duration: 0ms; }
}
.carousel-slide {
  flex: 0 0 100%;
  width: 100%; height: 100%;
  position: relative;
}

/* placeholder rooms — unstyled, just a centred label in ink */
.carousel-slide--placeholder {
  display: grid; place-items: center;
  background: var(--plaque-paper);
}
.room-placeholder {
  margin: 0;
  font-family: var(--plaque-font-body);
  font-size: 16px;
  letter-spacing: 0.02em;
  color: var(--plaque-ink);
  text-align: center;
}

/* the one permitted indicator: three dots, centred, bottom edge */
.carousel-dots {
  position: absolute;
  left: 50%; bottom: 48px;
  transform: translateX(-50%);
  display: flex; gap: 12px; align-items: center;
  z-index: 40;
  color: var(--plaque-ink);
}
.carousel-dot {
  width: 6px; height: 6px;
  padding: 0; margin: 0; border: 0;
  border-radius: 50%;
  color: var(--plaque-ink);
  background: currentColor;
  opacity: 0.2;
  cursor: pointer;
  transition: opacity var(--plaque-t-fast);
}
.carousel-dot[aria-current="true"] { opacity: 1; }
.carousel-dot:focus-visible { outline: 1px solid currentColor; outline-offset: 4px; }

/* ============================================================
   ROOM 1 — THE PLAQUE (faithful to production umbrella.css)
   ============================================================ */
.plaque {
  width: 100%; height: 100%;
  background: var(--plaque-paper);
  color: var(--plaque-ink);
  font-family: var(--plaque-font-body);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 188px var(--plaque-s-5) 40px;
  position: relative; isolation: isolate;
}

.plaque-wordmark {
  font-family: var(--plaque-font-wordmark);
  font-size: 248px;
  line-height: 0.92; letter-spacing: -0.02em; text-align: center; margin: 0;
  user-select: none; cursor: pointer;
  font-variation-settings: var(--plaque-mark-rest);
  transition: font-variation-settings var(--plaque-t-base);
  contain: layout;
}
.plaque-wordmark__given, .plaque-wordmark__family { display: block; }
.plaque[data-active="true"] .plaque-wordmark { font-variation-settings: var(--plaque-mark-active); }

@keyframes plaque-pulse {
  0%   { font-variation-settings: "opsz" 144, "wdth" 125, "wght" 800; animation-timing-function: ease-in; }
  50%  { font-variation-settings: "opsz" 144, "wdth" 125, "wght" 100; animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); }
  100% { font-variation-settings: "opsz" 144, "wdth" 125, "wght" 800; }
}
.plaque[data-pulsing="true"] .plaque-wordmark { animation: plaque-pulse 700ms; }
@media (prefers-reduced-motion: reduce) {
  .plaque[data-pulsing="true"] .plaque-wordmark { animation-duration: 0ms; }
}

.plaque-section-line {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center;
  gap: 0 var(--plaque-s-4); margin-top: var(--plaque-s-7);
}
.plaque-section {
  font-family: var(--plaque-font-body); font-size: var(--plaque-size-section);
  font-weight: 500;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--plaque-ink);
  text-decoration: none; transition: opacity var(--plaque-t-fast);
}
.plaque-section:hover, .plaque-section:focus-visible { opacity: 0.6; }
.plaque-section:focus-visible { outline: 1px solid var(--plaque-ink); outline-offset: 4px; }
.plaque-section-sep { color: var(--plaque-ink-3); font-size: var(--plaque-size-section); }

.plaque-meta { min-height: 1.5em; margin-top: var(--plaque-s-5); }
.plaque-meta__text {
  margin: 0; font-family: var(--plaque-font-body); font-size: var(--plaque-size-meta);
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--plaque-ink-3);
  opacity: 0; transition: opacity var(--plaque-t-base); text-align: center;
}
.plaque-meta__text[data-visible="true"] { opacity: 1; }

.plaque-copy {
  margin: var(--plaque-s-6) 0 0; font-family: var(--plaque-font-body);
  font-size: var(--plaque-size-copy); color: var(--plaque-ink-3);
  text-align: center; max-width: 60ch;
}

.plaque-colophon {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline;
  gap: 0 var(--plaque-s-4); width: 100%; margin-top: auto; padding-top: var(--plaque-s-8);
  font-family: var(--plaque-font-body); font-size: var(--plaque-size-colophon);
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--plaque-ink-3);
}
.plaque-colophon__sep { color: var(--plaque-ink-3); }
.plaque-colophon a { color: var(--plaque-ink-2); text-decoration: none; transition: opacity var(--plaque-t-fast); }
.plaque-colophon a:hover, .plaque-colophon a:focus-visible { opacity: 0.6; }

/* theme toggle — fixed top-right, 28×28, 1px ink border, squared */
.plaque-chrome { position: absolute; top: var(--plaque-s-5); right: var(--plaque-s-5); z-index: 30; }
.theme-toggle {
  display: grid; place-items: center;
  width: 28px; height: 28px;
  background: transparent;
  border: 1px solid var(--plaque-ink);
  color: var(--plaque-ink);
  border-radius: 0; cursor: pointer; padding: 0;
  transition: opacity var(--plaque-t-fast);
}
.theme-toggle:hover, .theme-toggle:focus-visible { opacity: 0.6; }
.theme-toggle:focus-visible { outline: 1px solid var(--plaque-ink); outline-offset: 3px; }
.theme-toggle svg { width: 12px; height: 12px; }
.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: block; }
:root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
:root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

/* ============================================================
   ROOM 2 — BOTANICAL (line-art flora: draw-on, then sway)
   ============================================================ */
.room2 { position: relative; overflow: hidden; }
.room2-flora {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none; overflow: visible;
}
.room2 .plaque-wordmark { position: relative; z-index: 1; }

.room2-flora .ln {
  fill: none;
  stroke: var(--plaque-ink);
  stroke-width: 1.5;
  stroke-linecap: round; stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  stroke-dasharray: 1; stroke-dashoffset: 1;
}
/* draw + sway start only once Room 2 becomes the active slide */
.carousel-slide.r2-grow .room2-flora .ln {
  animation: r2draw var(--dur, 4s) ease-out var(--del, 0s) forwards;
}
@keyframes r2draw { to { stroke-dashoffset: 0; } }

.sway { transform-box: view-box; transform: rotate(0deg); }
.carousel-slide.r2-grow .sway {
  animation: r2sway var(--swd, 9s) ease-in-out var(--swdel, 6s) infinite;
}
.sway-monstera { transform-origin: 120px 888px;  --swd: 8s;  --swdel: 6s; }
.sway-banana   { transform-origin: 1402px 16px;  --swd: 9s;  --swdel: 8s; }
.sway-fern     { transform-origin: 1388px 898px; --swd: 10s; --swdel: 7s; }
@keyframes r2sway {
  0%   { transform: rotate(0deg); }
  25%  { transform: rotate(2deg); }
  50%  { transform: rotate(0deg); }
  75%  { transform: rotate(-2deg); }
  100% { transform: rotate(0deg); }
}
@media (prefers-reduced-motion: reduce) {
  .room2-flora .ln,
  .carousel-slide.r2-grow .room2-flora .ln { animation: none; stroke-dashoffset: 0; }
  .sway, .carousel-slide.r2-grow .sway { animation: none; }
}

/* ---- Room 2 — Day & Night atmosphere (exact spec palette, scoped) ---- */
:root[data-theme="light"] .room2 { --plaque-paper: #fdfbf5; --plaque-ink: #1a1612; background: #fdfbf5; }
:root[data-theme="dark"]  .room2 { --plaque-paper: #1a1612; --plaque-ink: #fdfbf5; background: #1a1612; }

.room2-bird, .room2-night {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: visible;
}
.room2-bird  { z-index: 3; }
.room2-night { z-index: 2; }
.room2-bird path {
  fill: none; stroke: var(--plaque-ink); stroke-width: 1.5;
  stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke;
}
/* bird is a day element; night creatures are dark-only */
:root[data-theme="dark"]  .room2-bird  { display: none; }
:root[data-theme="light"] .room2-night { display: none; }

.r2-eye  { fill: var(--plaque-ink); transform-box: fill-box; transform-origin: center; }
.r2-eyes { transition: opacity .5s ease; }
.r2-bug  { animation: r2bugPulse 4s ease-in-out infinite; }
@keyframes r2bugPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .r2-bug { animation: none; opacity: .85; } }

/* ============================================================
   ROOM 3 — LUNAR (night; the cream canvas finally breaks)
   ============================================================ */
.room3 { background: #0a0807; color: #fdfbf5; overflow: hidden; }
.room3-sky {
  position: absolute; inset: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}
.room3-surface {
  position: absolute; left: 0; right: 0; bottom: 0; height: 25%;
  background: linear-gradient(to bottom, rgba(28,23,20,0) 0%, rgba(28,23,20,0.5) 55%, #1c1714 100%);
  z-index: 0; pointer-events: none;
}
.room3-surface::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: rgba(253,251,245,0.05);
}
.room3-wordmark { position: relative; z-index: 1; color: #fdfbf5; }
.room3 .r3-line { display: block; }
.room3 .g { display: inline-block; transform-origin: 50% 50%; }
/* untouched anchors: L, u, d (no transform) */
.room3 .g-c  { transform: translate(26px, -80px) rotate(12deg); }
.room3 .g-a  { opacity: 0; }                              /* escaped upward */
.room3 .g-s  { transform: translate(60px, -150px) rotate(-25deg); }
.room3 .g-R  { transform: translate(0, -20px) rotate(3deg); }
.room3 .g-e1 { transform: translate(0, 120px) rotate(45deg); }
.room3 .g-e2 { transform: translate(-676px, 278px) rotate(90deg); } /* landed bottom-left on the regolith */

/* carousel dots invert to pure cream when Room 3 is active */
.carousel-dots.dots-on-night .carousel-dot { color: #fdfbf5; }

/* ============================================================
   ROOM 4 — MICROSCOPY (lit circular viewport on a dim warm field)
   ============================================================ */
.room4 { background: #1c1714; overflow: hidden; justify-content: center; padding-top: 0; padding-bottom: 0; }
/* dim warm field — darkest at corners, slightly warmer toward the lens */
.room4-field {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, #1c1714 0%, #1c1714 34%, #15110d 70%, #0f0c0a 100%);
}
/* blurred unfocused slide haze ringing the lens */
.room4-haze {
  position: absolute; left: 50%; top: 50%; z-index: 1; pointer-events: none;
  width: 900px; height: 900px; transform: translate(-50%, -50%);
  background: radial-gradient(circle 450px at 50% 50%,
    rgba(253,251,245,0) 71%,
    rgba(253,251,245,0.11) 80%,
    rgba(253,251,245,0.05) 88%,
    rgba(253,251,245,0) 100%);
  filter: blur(12px);
}
/* the lit viewport — soft luminous falloff, no drawn ring */
.room4-lens {
  position: absolute; left: 50%; top: 50%; z-index: 2; pointer-events: none;
  width: 660px; height: 660px; transform: translate(-50%, -50%);
  background: radial-gradient(circle 330px at 50% 50%,
    #fefdf8 0%,
    #fdfbf5 60%,
    #fdfbf5 72.7%,
    rgba(253,251,245,0) 97%);
}
.room4-orgs { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }
.room4-wordmark {
  position: relative; z-index: 4; color: #1a1612;
  font-size: 150px;
}

/* paramecium — gentle leftward arc drift, no rotation, 12s */
.r4-para-drift { animation: r4paraDrift 12s ease-in-out infinite; }
@keyframes r4paraDrift {
  0%   { transform: translate(0px, 0px); }
  50%  { transform: translate(-26px, -14px); }
  100% { transform: translate(0px, 0px); }
}
/* diatom — slow spin in place, 30s */
.r4-diatom-spin { transform-box: fill-box; transform-origin: center; animation: r4spin 30s linear infinite; }
@keyframes r4spin { to { transform: rotate(360deg); } }
/* tardigrade — amble left->right across viewport bottom, 20s, blur near edges */
.r4-tardi-cross { animation: r4tardiCross 20s linear infinite; }
@keyframes r4tardiCross {
  0%   { transform: translateX(430px);  filter: blur(4px); }
  12%  { filter: blur(0px); }
  88%  { filter: blur(0px); }
  100% { transform: translateX(1010px); filter: blur(4px); }
}
/* tardigrade legs — alternate-step articulation */
.r4-leg { transform-box: fill-box; }
.r4-leg-0 { animation: r4leg 1.4s ease-in-out infinite; }
.r4-leg-1 { animation: r4leg 1.4s ease-in-out infinite; animation-delay: -0.7s; }
@keyframes r4leg {
  0%,100% { transform: rotate(-7deg); }
  50%     { transform: rotate(7deg); }
}
@media (prefers-reduced-motion: reduce) {
  .r4-para-drift, .r4-diatom-spin, .r4-tardi-cross, .r4-leg { animation: none; }
  .r4-tardi-cross { transform: translateX(660px); }
}

</style>
</head>
<body>
<div class="stage">
  <div class="frame" id="frame">
    <div class="carousel" id="carousel">
      <div class="carousel-track" id="track">

        <section class="carousel-slide" data-screen-label="Room 1">
    <main class="plaque" id="plaque" data-screen-label="umbrella">
      <div class="plaque-chrome">
        <button class="theme-toggle" id="toggle" type="button" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <h1 class="plaque-wordmark" id="wordmark">
        <span class="plaque-wordmark__given">Lucas</span>
        <span class="plaque-wordmark__family">Reed</span>
      </h1>

      <nav class="plaque-section-line" aria-label="Sections" id="sections">
        <a class="plaque-section" href="#" data-path="/tech" data-meta="/tech · latest post — 3 days ago · engineering, infrastructure, writing.">/tech</a>
        <span class="plaque-section-sep" aria-hidden="true">·</span>
        <a class="plaque-section" href="#" data-path="/news" data-meta="/news · latest brief — yesterday · daily briefs.">/news</a>
        <span class="plaque-section-sep" aria-hidden="true">·</span>
        <a class="plaque-section" href="#" data-path="/cobalt-paper" data-meta="/cobalt-paper · last updated — 2 weeks ago · generative work.">/cobalt-paper</a>
      </nav>

      <div class="plaque-meta" aria-live="polite">
        <p class="plaque-meta__text" id="meta"></p>
      </div>

      <p class="plaque-copy">A personal index of small sites — engineering, generative work, daily briefs.</p>

      <footer class="plaque-colophon">
        <a href="mailto:hi@lucasreed.me">hi@lucasreed.me</a>
        <span class="plaque-colophon__sep" aria-hidden="true">·</span>
        <a href="https://github.com/LucasGeno" rel="me">GitHub</a>
        <span class="plaque-colophon__sep" aria-hidden="true">·</span>
        <a href="#">RSS</a>
      </footer>
    </main>
        </section>

        <section class="carousel-slide" data-screen-label="Room 2">
          <main class="plaque room2" data-screen-label="botanical">
            <svg class="room2-flora" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
              <g class="sway sway-monstera">

<script>
(function () {
  // ---- scale the fixed frame to fit the viewport (letterboxed) ----
  var frame = document.getElementById("frame");
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!w || !h) { requestAnimationFrame(fit); return; }
    var s = Math.min(w / 1440, h / 900);
    frame.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);

  // ---- signature interaction 1: section-hover thinning + meta fade ----
  var plaque = document.getElementById("plaque");
  var meta = document.getElementById("meta");
  var sections = document.getElementById("sections").querySelectorAll(".plaque-section");
  function activate(el) {
    plaque.setAttribute("data-active", "true");
    meta.textContent = el.getAttribute("data-meta");
    meta.setAttribute("data-visible", "true");
  }
  function deactivate() {
    plaque.removeAttribute("data-active");
    meta.removeAttribute("data-visible");
  }
  sections.forEach(function (el) {
    el.addEventListener("click", function (e) { e.preventDefault(); });
    el.addEventListener("mouseenter", function () { activate(el); });
    el.addEventListener("mouseleave", deactivate);
    el.addEventListener("focus", function () { activate(el); });
    el.addEventListener("blur", deactivate);
  });

  // ---- signature interaction 2: wordmark tap-pulse ----
  var wordmark = document.getElementById("wordmark");
  var pulseTimer = null;
  wordmark.addEventListener("click", function () {
    if (pulseTimer) clearTimeout(pulseTimer);
    plaque.removeAttribute("data-pulsing");
    // force reflow so the animation restarts on rapid taps
    void plaque.offsetWidth;
    plaque.setAttribute("data-pulsing", "true");
    pulseTimer = setTimeout(function () { plaque.removeAttribute("data-pulsing"); }, 720);
  });

  // ---- theme toggle ----
  document.getElementById("toggle").addEventListener("click", function () {
    var root = document.documentElement;
    root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  // ---- carousel: arrow keys, horizontal scroll, swipe, dots ----
  var track = document.getElementById("track");
  var dots = Array.prototype.slice.call(document.querySelectorAll(".carousel-dot"));
  var COUNT = 4, index = 0;
  function goTo(i) {
    index = Math.max(0, Math.min(COUNT - 1, i));
    track.style.transform = "translateX(" + (-index * 100) + "%)";
    dots.forEach(function (d, n) { d.setAttribute("aria-current", n === index ? "true" : "false"); });
    if (index === 1) {
      var r2 = document.querySelectorAll(".carousel-slide")[1];
      if (r2) r2.classList.add("r2-grow");
    }
    document.getElementById("dots").classList.toggle("dots-on-night", index === 2 || index === 3);
  }
  var _params = new URLSearchParams(location.search);
  var _sc = _params.get("showcase");
  if (_params.get("theme")) document.documentElement.setAttribute("data-theme", _params.get("theme"));
  var _initRoom = 3;
  if (_sc === "day" || _sc === "night") {
    _initRoom = 1;
    document.documentElement.setAttribute("data-theme", _sc === "night" ? "dark" : "light");
  } else if (_params.get("room")) {
    _initRoom = Math.max(0, Math.min(COUNT - 1, (parseInt(_params.get("room"), 10) || 1) - 1));
  }
  goTo(_initRoom); // initial slide (URL-overridable); Room 1 is the canonical front door

  dots.forEach(function (d) {
    d.addEventListener("click", function () { goTo(parseInt(d.getAttribute("data-index"), 10)); });
  });

  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { goTo(index + 1); }
    else if (e.key === "ArrowLeft") { goTo(index - 1); }
  });

  // horizontal wheel / trackpad scroll
  var wheelLock = false;
  document.getElementById("carousel").addEventListener("wheel", function (e) {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    if (wheelLock) return;
    if (e.deltaX > 12) { goTo(index + 1); wheelLock = true; }
    else if (e.deltaX < -12) { goTo(index - 1); wheelLock = true; }
    if (wheelLock) setTimeout(function () { wheelLock = false; }, 600);
  }, { passive: false });

  // touch swipe
  var touchX = null;
  var carousel = document.getElementById("carousel");
  carousel.addEventListener("touchstart", function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  carousel.addEventListener("touchend", function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (dx < -48) { goTo(index + 1); }
    else if (dx > 48) { goTo(index - 1); }
    touchX = null;
  }, { passive: true });
})();
</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var showcase = params.get("showcase");
  var room2 = document.querySelector(".room2");
  var birdG = document.querySelector(".room2-bird .bird");
  var nightSvg = document.querySelector(".room2-night");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var frame = document.getElementById("frame");
  function theme() { return document.documentElement.getAttribute("data-theme"); }

  // ----- bird (day): a glimpse, ~30-60s apart, 6s gentle-arc crossing -----
  function flyBird() {
    if (!birdG) return;
    var dir = Math.random() < 0.5 ? 1 : -1;
    var band = 110 + Math.random() * 320;
    var drop = (Math.random() - 0.5) * 130;
    var x0 = dir > 0 ? -60 : 1500, x1 = dir > 0 ? 1500 : -60;
    var dur = 6000, t0 = performance.now();
    birdG.setAttribute("opacity", "1");
    (function step(t) {
      var p = (t - t0) / dur;
      if (p >= 1) { birdG.setAttribute("opacity", "0"); scheduleBird(); return; }
      var x = x0 + (x1 - x0) * p;
      var y = band + drop * Math.sin(Math.PI * p);
      var ang = (dir > 0 ? 6 : -6) + (drop > 0 ? 6 : -6) * Math.cos(Math.PI * p);
      birdG.setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ") rotate(" + ang.toFixed(1) + ") scale(" + dir + ",1)");
      requestAnimationFrame(step);
    })(t0);
  }
  function scheduleBird() {
    if (reduce) return;
    setTimeout(function () { theme() === "dark" ? scheduleBird() : flyBird(); }, 30000 + Math.random() * 30000);
  }

  // ----- eyes (night): one pair, rotating zones, blink, hunt-cooldown -----
  var zones = { A: [720, 128], B: [1185, 452], C: [322, 832] };
  var eyeEls = nightSvg ? [].slice.call(nightSvg.querySelectorAll(".r2-eyes")) : [];
  var cooldownUntil = 0, zi = 0, activeEye = null, eyeState = "idle", eyesTimer = null;
  function byZone(z) { for (var i = 0; i < eyeEls.length; i++) if (eyeEls[i].getAttribute("data-zone") === z) return eyeEls[i]; return null; }
  function setLids(el, sy) { el.querySelectorAll(".r2-eye").forEach(function (s) { s.style.transform = "scaleY(" + sy + ")"; }); }
  function showEyes() {
    if (reduce) return;
    if (performance.now() < cooldownUntil) { scheduleEyes(6000); return; }
    var z = ["A", "B", "C"][zi++ % 3], el = byZone(z);
    if (!el) { scheduleEyes(5000); return; }
    activeEye = el; eyeState = "open";
    el.style.transition = "opacity .5s ease";
    el.querySelectorAll(".r2-eye").forEach(function (s) { s.style.transition = "transform .12s ease"; });
    setLids(el, 1); el.setAttribute("opacity", "1");
    var hold = 2000 + Math.random() * 2000;
    setTimeout(function () { if (eyeState === "open") { setLids(el, 0.04); setTimeout(function () { if (eyeState === "open") setLids(el, 1); }, 150); } }, hold * 0.5);
    setTimeout(function () { if (eyeState === "open") { eyeState = "idle"; el.setAttribute("opacity", "0"); activeEye = null; scheduleEyes(); } }, hold);
  }
  function scheduleEyes(delay) {
    if (reduce) return;
    clearTimeout(eyesTimer);
    eyesTimer = setTimeout(function () { theme() === "dark" ? showEyes() : scheduleEyes(8000); }, delay != null ? delay : 15000 + Math.random() * 15000);
  }
  // hunted: cursor within ~100px snaps them shut + long cooldown
  if (nightSvg) {
    document.getElementById("carousel").addEventListener("pointermove", function (e) {
      if (eyeState !== "open" || !activeEye || theme() !== "dark") return;
      var fr = frame.getBoundingClientRect(), s = fr.width / 1440 || 1;
      var zc = zones[activeEye.getAttribute("data-zone")];
      var d = Math.hypot(e.clientX - (fr.left + zc[0] * s), e.clientY - (fr.top + zc[1] * s));
      if (d < 100 * s) {
        activeEye.style.transition = "none"; activeEye.setAttribute("opacity", "0");
        eyeState = "idle"; activeEye = null;
        cooldownUntil = performance.now() + (45000 + Math.random() * 45000);
        scheduleEyes(cooldownUntil - performance.now() + 500);
      }
    });
  }

  // ----- init -----
  if (showcase === "day") {
    if (room2) room2.classList.add("showcase-day");
    if (birdG) { birdG.setAttribute("transform", "translate(432,225) rotate(8)"); birdG.setAttribute("opacity", "1"); }
  } else if (showcase === "night") {
    if (room2) room2.classList.add("showcase-night");
    var ea = byZone("A"); if (ea) ea.setAttribute("opacity", "1");
  } else {
    scheduleBird();
    scheduleEyes();
  }
})();
</script>
</body>
</html>

name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: umbrella-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags:            tag:ci

      - name: rsync repo to droplet
        # Target is "/" because the deploy key's authorized_keys forced-command is
        # rrsync-jailed to /opt/platform/umbrella/ — paths are relative to that root.
        env:
          SSH_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<<"$SSH_KEY"
          rsync -av --delete --chmod=D755,F644 \
            --exclude=.git \
            --exclude=.github \
            --exclude=README.md \
            --exclude=.gitignore \
            -e "ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519" \
            ./ deploy@platform:/

      - name: smoke-test umbrella endpoint
        # Curls a static asset unique to the new static umbrella (css/tokens.css).
        # Pre-cutover: 404 (FastAPI has no such route).
        # Post-cutover (Task 11): 200 (Caddy serves /css/tokens.css from /srv/umbrella/).
        # Best-effort — continue-on-error keeps the deploy from failing on the
        # transition window. The real signal is whether rsync succeeded above.
        continue-on-error: true
        run: |
          set +e
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://lucasreed.me/css/tokens.css)
          echo "smoke test: GET https://lucasreed.me/css/tokens.css -> $code"
